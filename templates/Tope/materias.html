<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Materias</title>

<style>

body{
    font-family:Arial;
    background:#f4f4f4;
}

header{
    background:#1aa05b;
    color:white;
    padding:20px;
    text-align:center;
}

.container{
    width:90%;
    max-width:1100px;
    margin:30px auto;
    background:white;
    padding:20px;
    border-radius:10px;
}

input,
textarea{
    width:100%;
    padding:10px;
    margin:5px 0 15px;
}

button{
    background:#1aa05b;
    color:white;
    border:none;
    padding:10px 20px;
    cursor:pointer;
}

table{
    width:100%;
    margin-top:20px;
    border-collapse:collapse;
}

th,td{
    border:1px solid #ddd;
    padding:10px;
    text-align:center;
}

th{
    background:#1aa05b;
    color:white;
}

.eliminar{
    color:red;
    text-decoration:none;
}

</style>

</head>
<body>

<header>
    <h1>Módulo de Materias</h1>
</header>

<div class="container">

<h2>Registrar Materia</h2>

<form action="{{ url_for('materias.agregar') }}" method="POST">

<input
type="text"
name="nombre"
placeholder="Nombre de la materia"
required>

<input
type="text"
name="clave"
placeholder="Clave"
required>

<input
type="text"
name="grado"
placeholder="Grado"
required>

<input
type="text"
name="periodo"
placeholder="Periodo"
required>

<textarea
name="descripcion"
placeholder="Descripción">
</textarea>

<button type="submit">
Guardar Materia
</button>

</form>

<hr>

<h2>Listado de Materias</h2>

<table>

<tr>
<th>ID</th>
<th>Nombre</th>
<th>Clave</th>
<th>Grado</th>
<th>Periodo</th>
<th>Acción</th>
</tr>

{% for materia in materias %}

<tr>

<td>{{ materia.id }}</td>

<td>{{ materia.nombre }}</td>

<td>{{ materia.clave }}</td>

<td>{{ materia.grado }}</td>

<td>{{ materia.periodo }}</td>

<td>

<a
class="eliminar"
href="{{ url_for('materias.eliminar', id=materia.id) }}">
Eliminar
</a>

</td>

</tr>

{% endfor %}

</table>

</div>

</body>
</html>
