<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Añadir Nueva Planeación</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #1a9c68; /* Verde idéntico al fondo */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .card {
            background-color: white;
            padding: 40px;
            border-radius: 8px; /* Bordes redondeados sutiles */
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 450px;
            text-align: left;
        }
        h1 {
            text-align: center;
            margin-top: 0;
            font-weight: bold;
            font-size: 24px;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }
        input[type="text"],
        textarea,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box; /* Asegura que el padding no afecte el ancho total */
            color: #555;
        }
        input[type="text"]::placeholder,
        textarea::placeholder {
            color: #aaa;
        }
        textarea {
            resize: vertical;
            min-height: 100px;
        }
        .submit-btn {
            background-color: #1a9c68; /* Botón verde sólido */
            color: white;
            border: none;
            padding: 15px;
            width: 100%;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
        }
        .submit-btn:hover {
            opacity: 0.9;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 30px;
            color: #1a9c68;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Nueva Planeación</h1>
        <form action="#" method="POST">
            <div class="form-group">
                <label for="titulo">Título de la Planeación</label>
                <input type="text" id="titulo" name="titulo" placeholder="Ej. Matematicas I, Primer Semestre" required>
            </div>

            <div class="form-group">
                <label for="descripcion">Descripción y Objetivos</label>
                <textarea id="descripcion" name="descripcion" placeholder="Detalla los temas y metas principales" required></textarea>
            </div>

            <div class="form-group">
                <label for="grado">Grado / Grupo</label>
                <select id="grado" name="grado" required>
                    <option value="" disabled selected>Selecciona un grado/grupo</option>
                    <option value="1a">1º Semestre - Grupo A</option>
                    <option value="1b">1º Semestre - Grupo B</option>
                    <option value="2a">2º Semestre - Grupo A</option>
                    </select>
            </div>

            <div class="form-group">
                <label for="fecha">Fecha de Entrega</label>
                <input type="text" id="fecha" name="fecha" placeholder="DD/MM/AAAA" required>
            </div>

            <button type="submit" class="submit-btn">Guardar Planeación</button>
        </form>
        <a href="docentes.html" class="back-link">Docentes</a> </div>

</body>
</html>
