
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Grupo</title>
<!--holamundo-->
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
        }

        body{
            background-color: #2fb16e; 
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .contenedor{
            max-width: 450px;
            width: 100%;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }

        h2{
            text-align:center;
            margin-bottom: 30px;
            color: #1e293b;
            font-weight: bold;
            font-size: 24px;
            letter-spacing: -0.5px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #475569;
            font-weight: 600;
            font-size: 14px;
        }

        input[type="text"], select {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-size: 14px;
            color: #334155;
            outline: none;
            transition: all 0.2s ease;
            background-color: #f8fafc;
        }

        input:focus, select:focus {
            border-color: #2fb16e;
            background-color: #fff;
            box-shadow: 0 0 0 3px rgba(47, 177, 110, 0.15);
        }

        .btn{
            display: block;
            width: 100%;
            padding: 14px;
            background: #2fb16e;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
            font-size: 16px;
            transition: background 0.2s ease;
            margin-top: 25px;
            border: none;
            cursor: pointer;
        }

        .btn:hover{
            background: #24965c; 
        }

        .btn-back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #64748b;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            transition: color 0.2s ease;
        }

        .btn-back:hover {
            color: #2fb16e;
        }
    </style>
</head>
<body>

<div class="contenedor">
    <h2>Editar Grupo</h2>

    <form action="#" method="POST">
        <div class="form-group">
            <label for="nombre_grupo">Nombre del Grupo</label>
            <input type="text" id="nombre_grupo" name="nombre_grupo" value="4-I" required>
        </div>

        <div class="form-group">
            <label for="turno">Turno</label>
            <select id="turno" name="turno" required>
                <option value="matutino" selected>Matutino</option>
                <option value="vespertino">Vespertino</option>
            </select>
        </div>

        <div class="form-group">
            <label for="carrera">Carrera / Especialidad</label>
            <input type="text" id="carrera" name="carrera" value="Programación" required>
        </div>

        <button type="submit" class="btn">Actualizar Grupo</button>
    </form>

    <a href="../../index.html" class="btn-back">← Volver al Inicio</a>
</div>

</body>
</html>
